services:

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: multitenant_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-multitenant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: multitenant_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  # Fastify Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    container_name: multitenant_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      HOST: 0.0.0.0
      DOMAIN: ${DOMAIN:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-multitenant_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN:-localhost}}
      # Admin credentials for seed
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-ChangeMe@FirstLogin2024!}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@localhost}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-app}-api.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${APP_NAME:-app}-api.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-app}-api.middlewares=redirect-to-https"
      - "traefik.http.routers.${APP_NAME:-app}-api-secure.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${APP_NAME:-app}-api-secure.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-app}-api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME:-app}-api.loadbalancer.server.port=3000"
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN:-localhost}/api}
    container_name: multitenant_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-5000}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN:-localhost}/api}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME:-app}-frontend.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.${APP_NAME:-app}-frontend.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-app}-frontend.middlewares=redirect-to-https"
      - "traefik.http.routers.${APP_NAME:-app}-frontend-secure.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.${APP_NAME:-app}-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-app}-frontend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME:-app}-frontend.loadbalancer.server.port=5000"
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
